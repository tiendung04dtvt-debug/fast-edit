<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="warmWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="50%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#f5d0fe"/>
    </linearGradient>
    <linearGradient id="shelfWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="30%" stop-color="#854d0e"/>
      <stop offset="70%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>
  <!-- Nền ấm cúng -->
  <rect width="1920" height="1080" fill="url(#warmWall)"/>
  <!-- Kệ sách lớn -->
  <rect x="140" y="40" width="1640" height="1000" rx="12" fill="#451a03"/>
  <rect x="160" y="60" width="1600" height="960" fill="url(#shelfWood)"/>
  <!-- Các tầng kệ -->
  <rect x="160" y="280" width="1600" height="30" fill="#451a03"/>
  <rect x="160" y="520" width="1600" height="30" fill="#451a03"/>
  <rect x="160" y="760" width="1600" height="30" fill="#451a03"/>
  <!-- Vách ngăn dọc -->
  <rect x="680" y="60" width="24" height="960" fill="#451a03"/>
  <rect x="1220" y="60" width="24" height="960" fill="#451a03"/>
  <!-- Sách trên kệ Tầng 1 -->
  <rect x="200" y="110" width="40" height="170" rx="4" fill="#1e3a8a"/>
  <rect x="245" y="90" width="35" height="190" rx="4" fill="#991b1b"/>
  <rect x="285" y="120" width="45" height="160" rx="4" fill="#166534"/>
  <rect x="335" y="100" width="30" height="180" rx="4" fill="#ca8a04"/>
  <rect x="370" y="130" width="50" height="150" rx="4" fill="#475569"/>
  <!-- Sách Tầng 2 -->
  <rect x="740" y="340" width="45" height="180" rx="4" fill="#065f46"/>
  <rect x="790" y="320" width="35" height="200" rx="4" fill="#831843"/>
  <rect x="830" y="350" width="50" height="170" rx="4" fill="#1e40af"/>
  <rect x="885" y="330" width="40" height="190" rx="4" fill="#ea580c"/>
  <!-- Đèn học ấm áp góc phải -->
  <circle cx="1600" cy="400" r="160" fill="#fef08a" opacity="0.18"/>
  <circle cx="1600" cy="400" r="80" fill="#fef08a" opacity="0.3"/>
</svg>
