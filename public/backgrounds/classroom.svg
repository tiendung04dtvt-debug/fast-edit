<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a2f"/>
      <stop offset="100%" stop-color="#14261f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <!-- Tường phòng học -->
  <rect width="1920" height="880" fill="url(#wall)"/>
  <!-- Sàn gỗ -->
  <rect y="880" width="1920" height="200" fill="url(#floor)"/>
  <!-- Bảng đen phấn trắng -->
  <rect x="260" y="80" width="1400" height="680" rx="16" fill="url(#wood)"/>
  <rect x="280" y="100" width="1360" height="640" rx="8" fill="url(#board)"/>
  <!-- Họa tiết trang trí bài giảng mờ nhẹ -->
  <text x="320" y="180" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" opacity="0.35">FAST EDIT · BÀI GIẢNG ĐIỆN TỬ</text>
  <line x1="320" y1="205" x2="900" y2="205" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
  <text x="320" y="270" font-family="Arial, sans-serif" font-size="28" fill="#a7f3d0" opacity="0.25">f(x) = ax² + bx + c</text>
  <text x="320" y="330" font-family="Arial, sans-serif" font-size="28" fill="#fef08a" opacity="0.25">E = mc²</text>
  <!-- Khay để phấn -->
  <rect x="360" y="740" width="1200" height="24" rx="4" fill="#78350f"/>
  <rect x="420" y="734" width="80" height="10" rx="2" fill="#f8fafc" opacity="0.8"/>
  <rect x="520" y="734" width="60" height="10" rx="2" fill="#fed7aa" opacity="0.8"/>
  <rect x="600" y="730" width="70" height="16" rx="3" fill="#38bdf8" opacity="0.7"/>
</svg>
